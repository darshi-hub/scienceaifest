<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protein Analyzer - Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@0.396.0"></script>
  
  <!-- Import the ProteinAnalyzer component -->
  <script type="text/babel">
    // Icons from lucide-react (simplified versions for testing)
    const lucideIcons = window.lucide || {};

    // Create icon components inline for testing
    const Dna = (props) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
        <path d="M21 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7"/>
        <path d="M5.5 3.5A2.5 2.5 0 0 1 8 6m3-2.5A2.5 2.5 0 0 0 8 6m0 0a7 7 0 0 0 0 4"/>
        <path d="M16 6a2.5 2.5 0 0 1-2.5 2.5M13.5 3.5A2.5 2.5 0 0 1 16 6m0 0a7 7 0 0 0 0 4"/>
      </svg>
    );

    const Upload = (props) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
    );

    const FlaskConical = (props) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
        <path d="M10 2v7.527a2 2 0 0 1-.211.896l-4.746 7.504A2 2 0 0 0 3 18.957V22h18v-3.043a2 2 0 0 0-.543-1.338l-4.746-7.504a2 2 0 0 1-.211-.896V2"/>
      </svg>
    );

    const Info = (props) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="16" x2="12" y2="12"/>
        <line x1="12" y1="8" x2="12.01" y2="8"/>
      </svg>
    );

    const Activity = (props) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
    );

    const Microscope = (props) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
        <path d="M6 4c-1 0-1 1-1 2v3c0 1 0 2 1 2"/>
        <path d="M6 4c1 0 1 1 1 2v3c0 1 0 2-1 2"/>
        <circle cx="6" cy="9" r="4"/>
        <path d="M6 13v8"/>
        <path d="M9 21h-6"/>
        <path d="M19 3c0-1-1-2-2-2s-2 1-2 2 1 2 2 2 2-1 2-2z"/>
        <path d="M15 8h8"/>
        <path d="M15 8v.01"/>
      </svg>
    );

    const ShieldAlert = (props) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    );

    const BookOpen = (props) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
    );

    const Play = (props) => (
      <svg viewBox="0 0 24 24" fill="currentColor" {...props}>
        <polygon points="5 3 19 12 5 21 5 3"/>
      </svg>
    );

    const X = (props) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    );

    const Layers = (props) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
        <polygon points="12 2 20 6 20 14 12 22 4 14 4 6 12 2"/>
        <polyline points="12 22 12 12"/>
        <polyline points="20 14 12 10 4 14"/>
      </svg>
    );

    const Waves = (props) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
        <path d="M12 5v14M5 12c1.5-2 3.5-4 7-4s5.5 2 7 4M5 18c1.5-2 3.5-4 7-4s5.5 2 7 4"/>
      </svg>
    );

    const Target = (props) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
        <circle cx="12" cy="12" r="1"/>
        <circle cx="12" cy="12" r="5"/>
        <circle cx="12" cy="12" r="9"/>
      </svg>
    );

    const AlertTriangle = (props) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3.05h16.94a2 2 0 0 0 1.71-3.05l-8.47-14.14a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
    );

    const Gauge = (props) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
        <path d="M12 2v20M2 12h20"/>
        <circle cx="12" cy="12" r="9"/>
      </svg>
    );

    const GaugeIcon = Gauge;

    const MapPin = (props) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
    );

    const ChevronDown = (props) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    );

    const ChevronUp = (props) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
        <polyline points="18 15 12 9 6 15"/>
      </svg>
    );

    // Now paste the actual ProteinAnalyzer component code
    const { useState, useCallback, useMemo, useRef } = React;

    // SCIENTIFIC REFERENCE DATA
    const RESIDUE_MASS = {
      G: 57.05, A: 71.08, S: 87.08, P: 97.12, V: 99.13, T: 101.10, C: 103.14,
      L: 113.16, I: 113.16, N: 114.10, D: 115.09, Q: 128.13, K: 128.17,
      E: 129.12, M: 131.19, H: 137.14, F: 147.18, R: 156.19, Y: 163.18, W: 186.21,
    };
    const WATER_MASS = 18.02;

    const KYTE_DOOLITTLE = {
      I: 4.5, V: 4.2, L: 3.8, F: 2.8, C: 2.5, M: 1.9, A: 1.8, G: -0.4, T: -0.7,
      S: -0.8, W: -0.9, Y: -1.3, P: -1.6, H: -3.2, E: -3.5, Q: -3.5, D: -3.5,
      N: -3.5, K: -3.9, R: -4.5,
    };

    const CHOU_FASMAN = {
      E: { a: 1.51, b: 0.37 }, A: { a: 1.42, b: 0.83 }, L: { a: 1.21, b: 1.30 },
      H: { a: 1.00, b: 0.87 }, M: { a: 1.45, b: 1.05 }, Q: { a: 1.11, b: 1.10 },
      W: { a: 1.08, b: 1.37 }, V: { a: 1.06, b: 1.70 }, F: { a: 1.13, b: 1.38 },
      K: { a: 1.16, b: 0.74 }, I: { a: 1.08, b: 1.60 }, D: { a: 1.01, b: 0.54 },
      T: { a: 0.83, b: 1.19 }, S: { a: 0.77, b: 0.75 }, R: { a: 0.98, b: 0.93 },
      C: { a: 0.70, b: 1.19 }, N: { a: 0.67, b: 0.89 }, Y: { a: 0.69, b: 1.47 },
      P: { a: 0.57, b: 0.55 }, G: { a: 0.57, b: 0.75 },
    };

    const AA_FULL_NAME = {
      A: "Alanine", R: "Arginine", N: "Asparagine", D: "Aspartate", C: "Cysteine",
      E: "Glutamate", Q: "Glutamine", G: "Glycine", H: "Histidine", I: "Isoleucine",
      L: "Leucine", K: "Lysine", M: "Methionine", F: "Phenylalanine", P: "Proline",
      S: "Serine", T: "Threonine", W: "Tryptophan", Y: "Tyrosine", V: "Valine",
    };

    const MOTIFS = [
      { name: "N-glycosylation site", pattern: /N[^P][ST]/g, note: "Marks where sugar chains may attach to the protein." },
      { name: "Casein Kinase II phosphorylation site", pattern: /[ST]..[DE]/g, note: "A tag an enzyme may use to add a phosphate group." },
      { name: "Protein Kinase C phosphorylation site", pattern: /[ST].[RK]/g, note: "Another common phosphate-attachment tag." },
      { name: "Walker A / P-loop motif", pattern: /[AG]....GK[ST]/g, note: "Often found in proteins that bind ATP or GTP." },
      { name: "RGD cell-attachment motif", pattern: /RGD/g, note: "Helps cells stick to surrounding tissue." },
    ];

    const EXAMPLES = {
      hbb: {
        label: "Hemoglobin Beta (HBB) — real sequence",
        sequence: "MVHLTPEEKSAVTALWGKVNVDEVGGEALGRLLVVYPWTQRFFESFGDLSTPDAVMGNPKVKAHGKKVLGAFSDGLAHLDNLKGTFATLSELHCDKLHVDPENFRLLGNVLVCVLAHHFGKEFTPPVQAAYQKVVAGVANALAHKYH",
        isFragment: false,
        disease: {
          title: "Hemoglobin Beta (HBB)",
          associations: [
            { disease: "Sickle Cell Disease", summary: "A single substitution at position 6 (glutamate → valine) causes hemoglobin to form rigid, sickle-shaped fibers under low oxygen." },
            { disease: "Beta-Thalassemia", summary: "Various mutations reduce or eliminate beta-globin production, unbalancing the alpha/beta globin ratio." },
          ],
          pathway: "Oxygen transport: hemoglobin tetramer assembly",
          whyItMatters: "Because beta-globin folds into a very precise pocket that cradles the oxygen-binding heme group.",
        },
      },
    };

    const GENERIC_DISEASE_NOTE = {
      title: "Custom Sequence",
      associations: [],
      pathway: null,
      whyItMatters: "This sequence isn't one of the curated example proteins.",
    };

    function cleanSequence(raw) {
      return raw.split("\n").filter((line) => !line.trim().startsWith(">")).join("").replace(/[^A-Za-z]/g, "").toUpperCase();
    }

    function seededRandom(seed) {
      let h = 0;
      for (let i = 0; i < seed.length; i++) {
        h = (h * 31 + seed.charCodeAt(i)) >>> 0;
      }
      return function next() {
        h = (h * 1103515245 + 12345) >>> 0;
        return (h % 10000) / 10000;
      };
    }

    function analyzeSequence(seq) {
      const length = seq.length;
      const rand = seededRandom(seq || "seed");

      let mw = WATER_MASS;
      for (const ch of seq) mw += RESIDUE_MASS[ch] ?? 110;

      const composition = {};
      for (const ch of seq) composition[ch] = (composition[ch] || 0) + 1;
      const compositionList = Object.entries(composition)
        .map(([code, count]) => ({ code, count, name: AA_FULL_NAME[code] || code, pct: (count / length) * 100 }))
        .sort((a, b) => b.count - a.count);

      let hydrophobicCount = 0;
      const kdTrack = [];
      for (const ch of seq) {
        const kd = KYTE_DOOLITTLE[ch] ?? 0;
        kdTrack.push(kd);
        if (kd > 0) hydrophobicCount++;
      }
      const hydrophobicPct = (hydrophobicCount / length) * 100;
      const hydrophilicPct = 100 - hydrophobicPct;

      let helix = 0, sheet = 0, coil = 0;
      const ssTrack = [];
      for (const ch of seq) {
        const p = CHOU_FASMAN[ch] || { a: 0.9, b: 0.9 };
        let label;
        if (p.a > p.b && p.a > 1.0) { label = "H"; helix++; }
        else if (p.b >= p.a && p.b > 1.0) { label = "E"; sheet++; }
        else { label = "C"; coil++; }
        ssTrack.push(label);
      }
      const helixPct = (helix / length) * 100;
      const sheetPct = (sheet / length) * 100;
      const coilPct = (coil / length) * 100;

      const motifHits = MOTIFS.map((m) => {
        const positions = [];
        let match;
        const re = new RegExp(m.pattern);
        while ((match = re.exec(seq)) && positions.length < 6) {
          positions.push(match.index + 1);
        }
        return { ...m, count: positions.length, positions };
      }).filter((m) => m.count > 0);

      const windowSize = Math.max(8, Math.floor(length / 10));
      const domains = [];
      let cursor = 0;
      const domainNames = ["N-terminal region", "Core structural domain", "Functional loop region", "C-terminal region", "Linker segment"];
      let dIdx = 0;
      while (cursor < length) {
        const segLen = Math.min(windowSize + Math.floor(rand() * windowSize), length - cursor);
        domains.push({
          name: domainNames[dIdx % domainNames.length],
          start: cursor + 1,
          end: cursor + segLen,
        });
        cursor += segLen;
        dIdx++;
      }

      const conservationTrack = seq.split("").map((ch, i) => {
        const base = 0.4 + rand() * 0.6;
        return Math.round(base * 100) / 100;
      });

      const nTerm = seq.slice(0, 20);
      const nTermHydro = nTerm.split("").filter((c) => (KYTE_DOOLITTLE[c] ?? 0) > 1.5).length / Math.max(1, nTerm.length);
      let location;
      if (nTermHydro > 0.5) location = "Membrane-associated / Secreted";
      else if (hydrophobicPct > 45) location = "Membrane-associated";
      else if (rand() > 0.5) location = "Cytoplasmic";
      else location = "Nuclear";

      const prolinePct = (composition["P"] || 0) / length * 100;
      let stability = 55 + (helixPct - sheetPct) * 0.15 + (hydrophobicPct - 50) * 0.25 - prolinePct * 0.4;
      stability = Math.max(5, Math.min(95, Math.round(stability)));

      const confidence = Math.round(58 + rand() * 30);

      const hotspots = conservationTrack
        .map((score, i) => ({ i, score }))
        .sort((a, b) => b.score - a.score)
        .slice(0, Math.min(5, Math.floor(length / 15) + 1))
        .map((h) => h.i + 1)
        .sort((a, b) => a - b);

      return {
        length, mw, compositionList, hydrophobicPct, hydrophilicPct, kdTrack,
        helixPct, sheetPct, coilPct, ssTrack, motifHits, domains,
        conservationTrack, location, stability, confidence, hotspots,
      };
    }

    // UI Components
    function Disclaimer({ compact }) {
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 10, background: "#1C130480", border: "1px solid #F59E0B44", color: "#FCD9A0", padding: compact ? 8 : 10, borderRadius: 10, fontSize: compact ? "0.74rem" : "0.82rem", marginBottom: compact ? 0 : 20 }}>
          <ShieldAlert size={compact ? 14 : 16} />
          <span>This analysis is generated for educational purposes only and is not intended for medical diagnosis or treatment.</span>
        </div>
      );
    }

    function InfoCard({ icon: Icon, title, accent, badge, children, explain }) {
      const [open, setOpen] = useState(false);
      return (
        <div style={{ background: "#0B1526", border: "1px solid #1E3A5480", borderRadius: 14, padding: 18, display: "flex", flexDirection: "column" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span style={{ width: 30, height: 30, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", background: `${accent}33`, color: accent }}><Icon size={16} /></span>
              <h3 style={{ fontSize: "0.88rem", margin: 0, fontWeight: 600 }}>{title}</h3>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              {badge && <span style={{ fontSize: "0.65rem", textTransform: "uppercase", letterSpacing: "0.04em", background: "#F59E0B22", color: "#F59E0B", padding: "4px 8px", borderRadius: 6, whiteSpace: "nowrap" }}>{badge}</span>}
              {explain && <button onClick={() => setOpen((o) => !o)} style={{ background: "#101E33", border: "1px solid #1E3A54", borderRadius: 6, width: 26, height: 26, color: "#7C93B3", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}><Info size={14} /></button>}
            </div>
          </div>
          <div>{children}</div>
          {explain && open && <div style={{ marginTop: 12, paddingTop: 12, borderTop: "1px dashed #1E3A54", color: "#7C93B3", fontSize: "0.82rem" }}><p>{explain}</p></div>}
        </div>
      );
    }

    function App() {
      const [sequence, setSequence] = useState("");
      const [exampleKey, setExampleKey] = useState("");
      const [stage, setStage] = useState("input");
      const [analysis, setAnalysis] = useState(null);
      const [diseaseInfo, setDiseaseInfo] = useState(null);
      const [fileError, setFileError] = useState("");
      const fileInputRef = useRef(null);

      const cleaned = useMemo(() => cleanSequence(sequence), [sequence]);

      const handleExampleChange = (e) => {
        const key = e.target.value;
        setExampleKey(key);
        setFileError("");
        if (key && EXAMPLES[key]) setSequence(EXAMPLES[key].sequence);
        else setSequence("");
      };

      const handleFile = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        if (!/\.(txt|fasta|fa)$/i.test(file.name)) {
          setFileError("Please upload a .txt or .fasta file.");
          return;
        }
        setFileError("");
        const reader = new FileReader();
        reader.onload = (ev) => {
          setSequence(String(ev.target.result || ""));
          setExampleKey("");
        };
        reader.readAsText(file);
      };

      const runAnalysis = useCallback(() => {
        const seq = cleanSequence(sequence);
        if (!seq || seq.length < 5) {
          setFileError("Enter a valid amino acid sequence (at least 5 residues).");
          return;
        }
        setFileError("");
        setStage("analyzing");
        setTimeout(() => {
          const result = analyzeSequence(seq);
          setAnalysis(result);
          setDiseaseInfo(exampleKey && EXAMPLES[exampleKey] ? EXAMPLES[exampleKey].disease : GENERIC_DISEASE_NOTE);
          setStage("results");
        }, 2000);
      }, [sequence, exampleKey]);

      const reset = () => {
        setStage("input");
        setAnalysis(null);
        setDiseaseInfo(null);
      };

      return (
        <div style={{ background: "radial-gradient(ellipse at top, #0A1930 0%, #050B14 55%)", minHeight: "100vh", color: "#E6EEF7", fontFamily: "'IBM Plex Sans', sans-serif", padding: "24px clamp(16px, 4vw, 56px) 60px" }}>
          <header style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16, flexWrap: "wrap", gap: 12 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
              <div style={{ width: 46, height: 46, borderRadius: 12, background: "linear-gradient(135deg, #3B82F6, #22D3EE)", display: "flex", alignItems: "center", justifyContent: "center", color: "#001018", boxShadow: "0 0 24px #22D3EE55" }}><Dna size={22} /></div>
              <div>
                <h1 style={{ fontSize: "1.35rem", fontWeight: 700, margin: 0 }}>Protein Analyzer</h1>
                <p style={{ margin: "2px 0 0", color: "#7C93B3", fontSize: "0.82rem" }}>Educational bioinformatics dashboard</p>
              </div>
            </div>
            {stage === "results" && <button onClick={reset} style={{ background: "transparent", color: "#7C93B3", border: "1px solid #1E3A54", padding: "8px 14px", fontSize: "0.8rem", borderRadius: 10, cursor: "pointer", display: "flex", alignItems: "center", gap: 8 }}><X size={14} /> New analysis</button>}
          </header>

          <Disclaimer />

          {stage !== "results" && (
            <main style={{ display: "grid", gridTemplateColumns: "1.3fr 1fr", gap: 20 }}>
              <div style={{ background: "#0B1526", border: "1px solid #1E3A5480", borderRadius: 16, padding: 24 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: "0.82rem", color: "#22D3EE", fontWeight: 600, marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.04em" }}><FlaskConical size={16} /> 1. Choose example protein</div>
                <select value={exampleKey} onChange={handleExampleChange} style={{ width: "100%", background: "#101E33", border: "1px solid #1E3A5480", color: "#E6EEF7", borderRadius: 10, padding: "12px 14px", fontFamily: "'IBM Plex Sans', sans-serif", fontSize: "0.85rem", cursor: "pointer" }}>
                  <option value="">— Select an example —</option>
                  {Object.entries(EXAMPLES).map(([key, v]) => (
                    <option key={key} value={key}>{v.label}</option>
                  ))}
                </select>

                <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: "0.82rem", color: "#22D3EE", fontWeight: 600, marginTop: 18, marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.04em" }}><Layers size={16} /> 2. Or paste sequence</div>
                <textarea value={sequence} onChange={(e) => { setSequence(e.target.value); setExampleKey(""); }} placeholder="MSTLNPKPQRKTKRNT..." rows={7} style={{ width: "100%", background: "#101E33", border: "1px solid #1E3A5480", color: "#E6EEF7", borderRadius: 10, padding: "12px 14px", fontFamily: "'IBM Plex Mono', monospace", fontSize: "0.85rem", resize: "vertical" }} />

                <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: "0.82rem", color: "#22D3EE", fontWeight: 600, marginTop: 18, marginBottom: 8, textTransform: "uppercase", letterSpacing: "0.04em" }}><Upload size={16} /> 3. Or upload .txt / .fasta file</div>
                <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
                  <button onClick={() => fileInputRef.current?.click()} style={{ background: "#101E33", color: "#E6EEF7", border: "1px solid #1E3A5480", padding: "10px 16px", fontSize: "0.85rem", borderRadius: 10, cursor: "pointer", display: "flex", alignItems: "center", gap: 8 }}><Upload size={14} /> Choose file</button>
                  <input ref={fileInputRef} type="file" accept=".txt,.fasta,.fa" hidden onChange={handleFile} />
                  <span style={{ color: "#7C93B3", fontSize: "0.76rem" }}>FASTA headers (lines starting with >) are ignored.</span>
                </div>

                {fileError && <div style={{ display: "flex", gap: 8, alignItems: "center", color: "#FCA5A5", fontSize: "0.8rem", marginTop: 10 }}><AlertTriangle size={14} /> {fileError}</div>}

                <div style={{ margin: "14px 0", color: "#7C93B3", fontSize: "0.8rem", fontFamily: "'IBM Plex Mono', monospace" }}>
                  {cleaned.length > 0 ? `${cleaned.length} valid residues detected` : "No sequence loaded yet"}
                </div>

                <button onClick={runAnalysis} disabled={stage === "analyzing"} style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, background: "linear-gradient(135deg, #3B82F6, #22D3EE)", color: "#001018", padding: "12px 22px", fontSize: "0.92rem", width: "100%", borderRadius: 10, border: "none", cursor: "pointer", fontWeight: 600, opacity: stage === "analyzing" ? 0.6 : 1 }}><Play size={16} /> Analyze Protein</button>
              </div>

              <div style={{ background: "#0B1526", border: "1px solid #1E3A5480", borderRadius: 16, padding: 24 }}>
                <h3 style={{ display: "flex", gap: 8, alignItems: "center", fontSize: "1rem", margin: "0 0 12px" }}><Microscope size={16} /> What this tool does</h3>
                <p style={{ color: "#7C93B3", fontSize: "0.87rem", lineHeight: 1.55, marginBottom: 12 }}>This dashboard shows how computational biology analyzes proteins:</p>
                <ul style={{ color: "#7C93B3", fontSize: "0.83rem", lineHeight: 1.7, paddingLeft: 18 }}>
                  <li>Real calculations: molecular weight, composition, hydrophobicity</li>
                  <li>Teaching heuristics: Chou-Fasman secondary structure</li>
                  <li>Simulated: domain boundaries, conservation, cellular location</li>
                </ul>
                <Disclaimer compact />
              </div>
            </main>
          )}

          {stage === "analyzing" && (
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "90px 20px", gap: 20 }}>
              <div style={{ width: 90, height: 90, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", background: "radial-gradient(circle, #22D3EE22, transparent 70%)", border: "1px solid #1E3A54" }}><Dna size={40} style={{ color: "#22D3EE", animation: "spin 2.2s linear infinite" }} /></div>
              <p style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: "1.1rem", color: "#E6EEF7" }}>Analyzing Protein...</p>
            </div>
          )}

          {stage === "results" && analysis && (
            <main style={{ display: "flex", flexDirection: "column", gap: 20 }}>
              <div style={{ background: "#0B1526", border: "1px solid #1E3A5480", borderRadius: 16, padding: 24 }}>
                <div style={{ fontSize: "0.8rem", color: "#7C93B3", marginTop: 12, fontFamily: "'IBM Plex Mono', monospace" }}>Sequence: {analysis.length} residues</div>
              </div>

              <InfoCard icon={Layers} title="Sequence Length" accent="#22D3EE" explain="This is the number of amino acid building blocks in the chain.">
                <div style={{ fontSize: "2rem", fontWeight: 700, color: "#E6EEF7" }}>{analysis.length}<span style={{ fontSize: "0.9rem", color: "#7C93B3", fontWeight: 500, marginLeft: 4 }}> residues</span></div>
              </InfoCard>

              <InfoCard icon={Activity} title="Molecular Weight" accent="#3B82F6" explain="Calculated by adding the average mass of each amino acid in the chain.">
                <div style={{ fontSize: "2rem", fontWeight: 700, color: "#E6EEF7" }}>{(analysis.mw / 1000).toFixed(2)}<span style={{ fontSize: "0.9rem", color: "#7C93B3", fontWeight: 500, marginLeft: 4 }}> kDa</span></div>
                <div style={{ color: "#7C93B3", fontSize: "0.78rem", marginTop: 4 }}>{analysis.mw.toFixed(1)} Da exact</div>
              </InfoCard>

              <InfoCard icon={MapPin} title="Predicted Cellular Location" badge="Educational estimate" accent="#F59E0B" explain="Estimated from hydrophobicity patterns.">
                <div style={{ fontSize: "1rem", fontWeight: 600, color: "#22D3EE", lineHeight: 1.4 }}>{analysis.location}</div>
              </InfoCard>

              <InfoCard icon={Waves} title="Hydrophobic vs Hydrophilic" accent="#3B82F6" explain="Each residue is classified using the Kyte-Doolittle hydrophobicity scale.">
                <div style={{ marginBottom: 12 }}>
                  <div style={{ height: 10, borderRadius: 6, background: "#1E3A54", overflow: "hidden", marginBottom: 6 }}>
                    <div style={{ width: `${analysis.hydrophobicPct}%`, height: "100%", background: "linear-gradient(90deg, #3B82F6, #22D3EE)" }} />
                  </div>
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: "0.76rem", color: "#7C93B3" }}>
                    <span>Hydrophobic {analysis.hydrophobicPct.toFixed(1)}%</span>
                    <span>Hydrophilic {analysis.hydrophilicPct.toFixed(1)}%</span>
                  </div>
                </div>
              </InfoCard>

              <InfoCard icon={Target} title="Secondary Structure" badge="Chou-Fasman heuristic" accent="#6366F1" explain="Each residue's tendency to form a helix, sheet, or coil.">
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  <div style={{ display: "grid", gridTemplateColumns: "90px 1fr 50px", alignItems: "center", gap: 10, fontSize: "0.8rem" }}>
                    <span>Alpha Helix</span>
                    <div style={{ height: 9, background: "#1E3A54", borderRadius: 5, overflow: "hidden" }}><div style={{ width: `${analysis.helixPct}%`, height: "100%", background: "#22D3EE" }} /></div>
                    <b>{analysis.helixPct.toFixed(1)}%</b>
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "90px 1fr 50px", alignItems: "center", gap: 10, fontSize: "0.8rem" }}>
                    <span>Beta Sheet</span>
                    <div style={{ height: 9, background: "#1E3A54", borderRadius: 5, overflow: "hidden" }}><div style={{ width: `${analysis.sheetPct}%`, height: "100%", background: "#6366F1" }} /></div>
                    <b>{analysis.sheetPct.toFixed(1)}%</b>
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "90px 1fr 50px", alignItems: "center", gap: 10, fontSize: "0.8rem" }}>
                    <span>Coil</span>
                    <div style={{ height: 9, background: "#1E3A54", borderRadius: 5, overflow: "hidden" }}><div style={{ width: `${analysis.coilPct}%`, height: "100%", background: "#475569" }} /></div>
                    <b>{analysis.coilPct.toFixed(1)}%</b>
                  </div>
                </div>
              </InfoCard>

              <div style={{ fontSize: "0.85rem", color: "#7C93B3", background: "#101E33", padding: 16, borderRadius: 10 }}>
                <strong>Top 5 Amino Acids:</strong>
                <ul style={{ paddingLeft: 18, margin: "8px 0 0" }}>
                  {analysis.compositionList.slice(0, 5).map(aa => (
                    <li key={aa.code}>{aa.name} ({aa.code}): {aa.pct.toFixed(1)}%</li>
                  ))}
                </ul>
              </div>

              <div style={{ fontSize: "0.85rem", color: "#7C93B3", background: "#101E33", padding: 16, borderRadius: 10 }}>
                <strong>Motif Matches:</strong>
                {analysis.motifHits.length === 0 ? (
                  <p style={{ margin: "8px 0 0" }}>No matches found for demonstration motifs.</p>
                ) : (
                  <ul style={{ paddingLeft: 18, margin: "8px 0 0" }}>
                    {analysis.motifHits.map(m => (
                      <li key={m.name}><strong>{m.name}</strong>: {m.count} match(es) at positions {m.positions.join(", ")}</li>
                    ))}
                  </ul>
                )}
              </div>

              <Disclaimer />
            </main>
          )}

          <style>{`
            @keyframes spin { to { transform: rotate(360deg); } }
          `}</style>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
