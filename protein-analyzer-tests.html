<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protein Analyzer - Test Results</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Courier New', monospace; 
      background: #050B14; 
      color: #E6EEF7; 
      padding: 20px;
      line-height: 1.6;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.8rem; margin-bottom: 10px; color: #22D3EE; }
    .header { background: #0B1526; padding: 20px; border-radius: 8px; border: 1px solid #1E3A54; margin-bottom: 20px; }
    .test-group { background: #0B1526; padding: 15px; border-radius: 8px; border: 1px solid #1E3A54; margin-bottom: 10px; }
    .test-group h2 { color: #22D3EE; font-size: 1rem; margin-bottom: 10px; }
    .pass { color: #34D399; }
    .fail { color: #FCA5A5; }
    .test { padding: 5px 0; margin-left: 15px; }
    .summary { 
      background: #0B1526; 
      padding: 20px; 
      border-radius: 8px; 
      border: 2px solid #1E3A54; 
      margin-top: 20px;
      font-size: 1.1rem;
    }
    .summary.success { border-color: #34D399; }
    .summary.failure { border-color: #FCA5A5; }
    .stat { display: inline-block; margin-right: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🧬 Protein Analyzer - Test Suite</h1>
      <p>Comprehensive validation of core analysis functions</p>
    </div>

    <div id="results"></div>

    <div id="summary" class="summary"></div>
  </div>

  <script>
    // ========================================================================
    // TEST DATA & FUNCTIONS
    // ========================================================================

    const RESIDUE_MASS = {
      G: 57.05, A: 71.08, S: 87.08, P: 97.12, V: 99.13, T: 101.10, C: 103.14,
      L: 113.16, I: 113.16, N: 114.10, D: 115.09, Q: 128.13, K: 128.17,
      E: 129.12, M: 131.19, H: 137.14, F: 147.18, R: 156.19, Y: 163.18, W: 186.21,
    };
    const WATER_MASS = 18.02;

    const KYTE_DOOLITTLE = {
      I: 4.5, V: 4.2, L: 3.8, F: 2.8, C: 2.5, M: 1.9, A: 1.8, G: -0.4, T: -0.7,
      S: -0.8, W: -0.9, Y: -1.3, P: -1.6, H: -3.2, E: -3.5, Q: -3.5, D: -3.5,
      N: -3.5, K: -3.9, R: -4.5,
    };

    const CHOU_FASMAN = {
      E: { a: 1.51, b: 0.37 }, A: { a: 1.42, b: 0.83 }, L: { a: 1.21, b: 1.30 },
      H: { a: 1.00, b: 0.87 }, M: { a: 1.45, b: 1.05 }, Q: { a: 1.11, b: 1.10 },
      W: { a: 1.08, b: 1.37 }, V: { a: 1.06, b: 1.70 }, F: { a: 1.13, b: 1.38 },
      K: { a: 1.16, b: 0.74 }, I: { a: 1.08, b: 1.60 }, D: { a: 1.01, b: 0.54 },
      T: { a: 0.83, b: 1.19 }, S: { a: 0.77, b: 0.75 }, R: { a: 0.98, b: 0.93 },
      C: { a: 0.70, b: 1.19 }, N: { a: 0.67, b: 0.89 }, Y: { a: 0.69, b: 1.47 },
      P: { a: 0.57, b: 0.55 }, G: { a: 0.57, b: 0.75 },
    };

    const AA_FULL_NAME = {
      A: "Alanine", R: "Arginine", N: "Asparagine", D: "Aspartate", C: "Cysteine",
      E: "Glutamate", Q: "Glutamine", G: "Glycine", H: "Histidine", I: "Isoleucine",
      L: "Leucine", K: "Lysine", M: "Methionine", F: "Phenylalanine", P: "Proline",
      S: "Serine", T: "Threonine", W: "Tryptophan", Y: "Tyrosine", V: "Valine",
    };

    const MOTIFS = [
      { name: "N-glycosylation site", pattern: /N[^P][ST]/g },
      { name: "Casein Kinase II phosphorylation site", pattern: /[ST]..[DE]/g },
      { name: "Protein Kinase C phosphorylation site", pattern: /[ST].[RK]/g },
      { name: "Walker A / P-loop motif", pattern: /[AG]....GK[ST]/g },
      { name: "RGD cell-attachment motif", pattern: /RGD/g },
    ];

    function cleanSequence(raw) {
      return raw.split("\n").filter((line) => !line.trim().startsWith(">")).join("").replace(/[^A-Za-z]/g, "").toUpperCase();
    }

    function seededRandom(seed) {
      let h = 0;
      for (let i = 0; i < seed.length; i++) {
        h = (h * 31 + seed.charCodeAt(i)) >>> 0;
      }
      return function next() {
        h = (h * 1103515245 + 12345) >>> 0;
        return (h % 10000) / 10000;
      };
    }

    function analyzeSequence(seq) {
      const length = seq.length;
      const rand = seededRandom(seq || "seed");

      let mw = WATER_MASS;
      for (const ch of seq) mw += RESIDUE_MASS[ch] ?? 110;

      const composition = {};
      for (const ch of seq) composition[ch] = (composition[ch] || 0) + 1;
      const compositionList = Object.entries(composition)
        .map(([code, count]) => ({ code, count, name: AA_FULL_NAME[code] || code, pct: (count / length) * 100 }))
        .sort((a, b) => b.count - a.count);

      let hydrophobicCount = 0;
      const kdTrack = [];
      for (const ch of seq) {
        const kd = KYTE_DOOLITTLE[ch] ?? 0;
        kdTrack.push(kd);
        if (kd > 0) hydrophobicCount++;
      }
      const hydrophobicPct = (hydrophobicCount / length) * 100;
      const hydrophilicPct = 100 - hydrophobicPct;

      let helix = 0, sheet = 0, coil = 0;
      const ssTrack = [];
      for (const ch of seq) {
        const p = CHOU_FASMAN[ch] || { a: 0.9, b: 0.9 };
        let label;
        if (p.a > p.b && p.a > 1.0) { label = "H"; helix++; }
        else if (p.b >= p.a && p.b > 1.0) { label = "E"; sheet++; }
        else { label = "C"; coil++; }
        ssTrack.push(label);
      }
      const helixPct = (helix / length) * 100;
      const sheetPct = (sheet / length) * 100;
      const coilPct = (coil / length) * 100;

      const motifHits = MOTIFS.map((m) => {
        const positions = [];
        let match;
        const re = new RegExp(m.pattern);
        while ((match = re.exec(seq)) && positions.length < 6) {
          positions.push(match.index + 1);
        }
        return { ...m, count: positions.length, positions };
      }).filter((m) => m.count > 0);

      return {
        length, mw, compositionList, hydrophobicPct, hydrophilicPct, kdTrack,
        helixPct, sheetPct, coilPct, ssTrack, motifHits,
      };
    }

    // ========================================================================
    // TEST FRAMEWORK
    // ========================================================================

    let testsPassed = 0;
    let testsFailed = 0;
    let currentGroup = null;
    let groupResults = [];

    function assertEquals(actual, expected, testName) {
      if (actual === expected) {
        addTestResult(true, testName);
        testsPassed++;
      } else {
        addTestResult(false, `${testName} (Expected: ${expected}, Got: ${actual})`);
        testsFailed++;
      }
    }

    function assertCloseTo(actual, expected, tolerance, testName) {
      if (Math.abs(actual - expected) <= tolerance) {
        addTestResult(true, testName);
        testsPassed++;
      } else {
        addTestResult(false, `${testName} (Expected: ~${expected} ±${tolerance}, Got: ${actual})`);
        testsFailed++;
      }
    }

    function assertTrue(condition, testName) {
      if (condition) {
        addTestResult(true, testName);
        testsPassed++;
      } else {
        addTestResult(false, testName);
        testsFailed++;
      }
    }

    function addTestResult(passed, name) {
      if (!groupResults[currentGroup]) groupResults[currentGroup] = [];
      groupResults[currentGroup].push({ passed, name });
    }

    // ========================================================================
    // TESTS
    // ========================================================================

    currentGroup = 0;
    currentGroup++;
    console.log("Running Test Group 1: Sequence Cleaning");
    assertEquals(cleanSequence("MVHLT"), "MVHLT", "Simple sequence");
    assertEquals(cleanSequence(">Header\nMVHLT\nPEEKS"), "MVHLTPEEKS", "FASTA format with header");
    assertEquals(cleanSequence("M-V.H*L@T"), "MVHLT", "Sequence with special characters");
    assertEquals(cleanSequence(""), "", "Empty sequence");

    currentGroup++;
    console.log("Running Test Group 2: Basic Sequence Analysis");
    const simple = analyzeSequence("AAAAA");
    assertEquals(simple.length, 5, "Sequence length calculation");
    assertEquals(simple.compositionList[0].code, "A", "Composition sorting");
    assertEquals(simple.compositionList[0].count, 5, "Amino acid count");
    assertCloseTo(simple.compositionList[0].pct, 100, 0.1, "Percentage calculation");

    currentGroup++;
    console.log("Running Test Group 3: Molecular Weight");
    const protein = analyzeSequence("MVHLTPEEKS");
    assertTrue(protein.mw > 1000, "MW greater than 1000");
    assertCloseTo(protein.mw, 1100, 50, "Molecular weight in reasonable range");

    currentGroup++;
    console.log("Running Test Group 4: Hydrophobicity Analysis");
    const hydrophobic = analyzeSequence("IIIVVVLLL");
    assertTrue(hydrophobic.hydrophobicPct > 80, "High hydrophobic percentage");
    const hydrophilic = analyzeSequence("KKKKRRRDD");
    assertTrue(hydrophilic.hydrophobicPct < 20, "Low hydrophobic percentage");

    currentGroup++;
    console.log("Running Test Group 5: Secondary Structure");
    assertTrue(simple.helixPct >= 0 && simple.helixPct <= 100, "Helix percentage valid");
    assertTrue(simple.sheetPct >= 0 && simple.sheetPct <= 100, "Sheet percentage valid");
    assertTrue(simple.coilPct >= 0 && simple.coilPct <= 100, "Coil percentage valid");
    const totalSS = simple.helixPct + simple.sheetPct + simple.coilPct;
    assertCloseTo(totalSS, 100, 0.1, "Secondary structure sum to 100%");

    currentGroup++;
    console.log("Running Test Group 6: Motif Detection");
    const rgd = analyzeSequence("ACRGDCA");
    const rgdHits = rgd.motifHits.filter(m => m.name.includes("RGD"));
    assertTrue(rgdHits.length > 0 && rgdHits[0].count > 0, "RGD motif detected");
    const noMotif = analyzeSequence("GGGGGGG");
    assertEquals(noMotif.motifHits.length, 0, "No motifs in G repeat");

    currentGroup++;
    console.log("Running Test Group 7: Hemoglobin Beta");
    const hemoglobin = "MVHLTPEEKSAVTALWGKVNVDEVGGEALGRLLVVYPWTQRFFESFGDLSTPDAVMGNPKVKAHGKKVLGAFSDGLAHLDNLKGTFATLSELHCDKLHVDPENFRLLGNVLVCVLAHHFGKEFTPPVQAAYQKVVAGVANALAHKYH";
    const hbbAnalysis = analyzeSequence(hemoglobin);
    assertEquals(hbbAnalysis.length, 146, "Hemoglobin Beta length");
    assertTrue(hbbAnalysis.mw > 15000 && hbbAnalysis.mw < 17000, "Hemoglobin Beta MW range");
    assertTrue(hbbAnalysis.helixPct > 50, "Hemoglobin helix content");

    currentGroup++;
    console.log("Running Test Group 8: Composition Analysis");
    const known = analyzeSequence("AAG");
    const aCount = known.compositionList.find(c => c.code === "A");
    assertEquals(aCount.count, 2, "Count of A in AAG");
    assertCloseTo(aCount.pct, (2/3)*100, 0.1, "Percentage of A in AAG");

    currentGroup++;
    console.log("Running Test Group 9: Edge Cases");
    assertEquals(cleanSequence("   "), "", "Whitespace-only sequence");
    const singleAA = analyzeSequence("M");
    assertEquals(singleAA.length, 1, "Single amino acid length");
    assertTrue(singleAA.compositionList.length === 1, "Single amino acid composition");

    currentGroup++;
    console.log("Running Test Group 10: Determinism Check");
    const seq1 = analyzeSequence("MVHLT");
    const seq2 = analyzeSequence("MVHLT");
    assertEquals(seq1.length, seq2.length, "Deterministic sequence length");
    assertEquals(seq1.helixPct, seq2.helixPct, "Deterministic secondary structure");

    // ========================================================================
    // RENDER RESULTS
    // ========================================================================

    const testGroupNames = [
      "Sequence Cleaning",
      "Basic Sequence Analysis",
      "Molecular Weight",
      "Hydrophobicity Analysis",
      "Secondary Structure",
      "Motif Detection",
      "Hemoglobin Beta Example",
      "Composition Analysis",
      "Edge Cases",
      "Determinism Check"
    ];

    let html = "";
    for (let i = 0; i < groupResults.length; i++) {
      const results = groupResults[i];
      if (!results) continue;
      html += `<div class="test-group">`;
      html += `<h2>[Test Group ${i + 1}] ${testGroupNames[i]}</h2>`;
      for (const result of results) {
        const className = result.passed ? 'pass' : 'fail';
        const icon = result.passed ? '✓' : '✗';
        html += `<div class="test ${className}">${icon} ${result.name}</div>`;
      }
      html += `</div>`;
    }

    document.getElementById("results").innerHTML = html;

    // Summary
    const summaryClass = testsFailed === 0 ? "success" : "failure";
    const summaryText = testsFailed === 0 
      ? "✓ ALL TESTS PASSED! The ProteinAnalyzer app is functioning correctly."
      : `✗ ${testsFailed} test(s) failed. Review the errors above.`;

    document.getElementById("summary").className = `summary ${summaryClass}`;
    document.getElementById("summary").innerHTML = `
      <div class="stat"><strong>Passed:</strong> <span class="pass">${testsPassed}</span></div>
      <div class="stat"><strong>Failed:</strong> <span class="fail">${testsFailed}</span></div>
      <br><br>${summaryText}
    `;

    console.log(`Test Results: ${testsPassed} passed, ${testsFailed} failed`);
  </script>
</body>
</html>
